<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Access</title>
    <style>
        /* --- CSS SIMPLE & UNIFIED --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }

        body {
            background-color: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: #1f2937;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h2 { margin-bottom: 20px; color: #3b82f6; }

        .input-group { margin-bottom: 15px; text-align: left; }

        label { display: block; font-size: 14px; margin-bottom: 5px; color: #9ca3af; }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #111827;
            color: white;
            outline: none;
        }

        input:focus { border-color: #3b82f6; }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-login:hover { background: #2563eb; }

        #error-text { color: #f87171; font-size: 13px; margin-top: 15px; display: none; }

        /* Responsif Laptop: Sedikit lebih lebar jika dibuka di layar besar */
        @media (min-width: 1024px) {
            .login-box { max-width: 450px; padding: 40px; }
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Login Admin</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="user" placeholder="Username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="pass" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-login">MASUK</button>
        </form>
        <p id="error-text">Username atau Password salah!</p>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            const err = document.getElementById('error-text');

            // Cek Login Sederhana
            if(u === "zanuar" && p === "zanuar2006") {
                sessionStorage.setItem("isLoggedIn", "true");
                window.location.href = "profile.html"; 
            } else {
                err.style.display = "block";
            }
        };
    </script>

</body>
</html>
